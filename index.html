<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano Esperança - O Melhor Plano de Paulo Afonso e Região</title>
<meta name="description" content="Plano de Assistência Funerária Esperança. Titular + 10 dependentes, assistência 24h, cremação e a estrutura do 1º Cemitério Parque de Paulo Afonso - BA.">
<link rel="icon" href="logo.jpeg">
<style>
:root{
  --verde-escuro:#1B5E20;
  --verde-claro:#4CAF50;
  --laranja:#F57C00;
  --dourado:#C9A227;
  --branco:#FFFFFF;
  --creme:#F4F7DC;
  --cinza-claro:#F9F9F9;
  --texto:#333333;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
html{scroll-behavior:smooth}
body{background:var(--cinza-claro);color:var(--texto);line-height:1.6}
img{max-width:100%;display:block}

/* HEADER */
header{background:var(--verde-escuro);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;color:var(--branco);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:bold}
.logo img{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:cover}
nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
nav a{color:var(--branco);text-decoration:none;font-size:14px;font-weight:bold}
nav a:hover{color:#FFCC80}
.tel{background:var(--laranja);padding:8px 16px;border-radius:20px}

/* HERO */
.hero{background:linear-gradient(rgba(27,94,32,.82),rgba(27,94,32,.95)),url('aerea.jpeg') center/cover,var(--verde-escuro);color:var(--branco);text-align:center;padding:60px 20px 80px}
.marca-hero{width:190px;height:190px;border-radius:50%;margin:0 auto 25px;background:#fff;border:6px solid var(--dourado);box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.15);object-fit:cover;animation:entrada 1s ease both}
@keyframes entrada{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:none}}
.selo{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#FFCC80;font-weight:bold;margin-bottom:14px}
.hero h1{font-size:38px;margin-bottom:15px;max-width:850px;margin-left:auto;margin-right:auto}
.hero p{font-size:19px;margin-bottom:28px}
.btn-laranja{background:var(--laranja);color:var(--branco);padding:15px 30px;border-radius:30px;text-decoration:none;font-weight:bold;font-size:18px;display:inline-block;box-shadow:0 4px 6px rgba(0,0,0,.2);transition:.3s;border:none;cursor:pointer}
.btn-laranja:hover{background:#E65100;transform:scale(1.05)}
.hero .btn-laranja{margin:5px}
.btn-borda{background:transparent;border:2px solid #fff}

.faixa-laranja{background:var(--laranja);color:var(--branco);text-align:center;padding:15px;font-weight:bold;font-size:19px;text-transform:uppercase;letter-spacing:1px}

section{padding:60px 20px}
.titulo{text-align:center;margin-bottom:35px}
.titulo h2{color:var(--verde-escuro);font-size:32px}
.titulo p{color:#666;margin-top:8px}
.titulo .linha{width:70px;height:4px;background:var(--laranja);margin:12px auto 0;border-radius:2px}

/* QUEM SOMOS */
.sobre{background:var(--creme)}
.sobre-grid{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:35px;align-items:center;justify-content:center}
.sobre-img{flex:1 1 320px;max-width:420px}
.sobre-img img{border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.2);width:100%;background:#ddd;min-height:200px;object-fit:cover}
.sobre-txt{flex:1 1 380px}
.sobre-txt p{margin-bottom:14px;font-size:16px}
.lema{background:var(--verde-escuro);color:#fff;padding:18px 22px;border-left:6px solid var(--laranja);border-radius:10px;font-size:20px;font-style:italic;margin-top:10px}
.pilares{max-width:1100px;margin:40px auto 0;display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.pilar{background:#fff;border-radius:15px;padding:25px;flex:1 1 280px;max-width:340px;border-top:5px solid var(--verde-claro);box-shadow:0 4px 15px rgba(0,0,0,.06)}
.pilar:nth-child(2){border-top-color:var(--laranja)}
.pilar .ico{font-size:32px}
.pilar h3{color:var(--verde-escuro);margin:8px 0}
.pilar ul{list-style:none}
.pilar ul li{margin-bottom:5px}

/* PLANOS */
.planos{
